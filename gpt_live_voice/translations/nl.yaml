# Nederlandse namen + hulp voor het Configuratie-tabblad.
# Alledaagse velden zijn altijd zichtbaar. Alles onder Advanced is optioneel
# (geen default in config.yaml) en verschijnt pas bij "Toon ongebruikte
# optionele configuratie-opties".
configuration:
  openai_api_key:
    name: "OpenAI API-sleutel"
    description: >-
      Je persoonlijke OpenAI-sleutel (begint met sk-...). Maak er een aan op
      platform.openai.com → API keys, en zorg dat facturering aanstaat.
  instructions:
    name: "Persoonlijkheid van de assistent"
    description: >-
      Tekstinstructies voor persoonlijkheid, taal en huisregels. TIP: dit veld
      is hier één regel — gebruik ⋮ → "Bewerken in YAML" voor een volledige
      teksteditor.
  transcription_language:
    name: "Gesproken taal (bijv. nl, en, de)"
    description: >-
      Tweetletterige taalcode. Schrijft ook wat je zei in het add-on-log.
      Leeg = automatisch detecteren.
  openai_voice:
    name: "Stem"
    description: >-
      De stem waarmee het praat. marin en cedar klinken het natuurlijkst.
      Herstart de add-on na een wijziging. Voor een niet-vermelde stem: kies
      "custom" en zet onderaan "Toon ongebruikte optionele configuratie-opties"
      aan.
  follow_up_listen_seconds:
    name: "Naluisteren (seconden)"
    description: >-
      Na een antwoord blijft het apparaat zo lang luisteren zonder wake word.
      8 voelt natuurlijk; 0 schakelt het uit.
  enable_web_search:
    name: "Webzoeken inschakelen"
    description: >-
      Laat de assistent online opzoeken: weer, nieuws, openingstijden, recente
      gebeurtenissen. Elke zoekactie is een extra OpenAI-aanroep.

  voice_provider:
    name: "Advanced · Stemprovider"
    description: >-
      Laat leeg voor gpt_live (gpt-live-1). openai_realtime is de vorige
      engine en heeft het Realtime-model hieronder nodig.
  openai_model:
    name: "Advanced · Oud Realtime-model"
    description: Alleen voor voice_provider=openai_realtime. Genegeerd door gpt-live-1.
  openai_model_custom:
    name: "Advanced · Oud Realtime-model (custom)"
    description: Alleen als Oud Realtime-model op "custom" staat.
  openai_voice_custom:
    name: "Advanced · Stem (custom)"
    description: Alleen als Stem op "custom" staat.
  openai_speed:
    name: "Advanced · Spreeksnelheid"
    description: "1.0 = normaal. Bereik 0.25–1.5. Standaard 1.0."
  max_output_tokens:
    name: "Advanced · Maximale antwoordlengte"
    description: Limiet in tokens. 0 of leeg = geen limiet.
  follow_up_open_delay_ms:
    name: "Advanced · Naluister-micvertraging (ms)"
    description: Pauze na een antwoord voordat de mic weer opengaat. Standaard 700.
  wake_open_delay_ms:
    name: "Advanced · Wake-micvertraging (ms)"
    description: Pauze na de wake-chime voordat de mic opengaat. Standaard 700.
  vad_eagerness:
    name: "Advanced · Beurtwisselsnelheid"
    description: Legacy Realtime VAD. Standaard low.
  phase_idle_debounce_ms:
    name: "Advanced · Eind-van-antwoord wachttijd (ms)"
    description: Hoe lang stilte een antwoord afsluit. Standaard 1500.
  web_search_model:
    name: "Advanced · Zoekmodel"
    description: Model voor webzoeken. Standaard gpt-5.5.
  web_search_model_custom:
    name: "Advanced · Zoekmodel (custom)"
    description: Alleen als Zoekmodel op "custom" staat.
  playback_prebuffer_ms:
    name: "Advanced · Afspeelbuffer (ms)"
    description: Jitterbuffer vóór afspelen. Standaard 150.
  noise_reduction:
    name: "Advanced · Microfoon-ruisonderdrukking"
    description: Extra mic-filtering. Standaard uit.
  ha_mcp_url:
    name: "Advanced · MCP-server-URL"
    description: Laat leeg voor de ingebouwde Home Assistant MCP Server.
  longlived_token:
    name: "Advanced · Toegangstoken"
    description: Laat leeg voor het ingebouwde supervisor-token.
  mcp_tool_allowlist:
    name: "Advanced · Tool-allowlist"
    description: Kommagescheiden Assist-tools; leeg = allemaal.
  live_planner_model:
    name: "Advanced · GPT-Live planner-model"
    description: Tekstmodel dat Assist-tools / web_search kiest. Standaard gpt-5.5.
  live_planner_model_custom:
    name: "Advanced · GPT-Live planner-model (custom)"
    description: Alleen als het planner-model op "custom" staat.
  websocket_port:
    name: "Advanced · Apparaatpoort"
    description: Poort waarop de Voice PE verbindt. Standaard 8080.
  session_reuse_timeout_seconds:
    name: "Advanced · Gesprek hervatten (seconden)"
    description: Legacy Realtime sessiehergebruik. Standaard 300.
  max_context_messages:
    name: "Advanced · Gespreksgeheugen"
    description: Legacy Realtime geheugengrootte. Standaard 12.
  transcription_model:
    name: "Advanced · Transcriptiemodel"
    description: Schrijft je spraak in het log. Standaard gpt-4o-transcribe.
  transcription_model_custom:
    name: "Advanced · Transcriptiemodel (custom)"
    description: Alleen als Transcriptiemodel op "custom" staat.
  turn_detection_type:
    name: "Advanced · Beurtdetectie (legacy)"
    description: Laat leeg. Alleen nodig voor het oude openai_realtime-pad.
  vad_threshold:
    name: "Advanced · server_vad luidheidsdrempel"
    description: Alleen bij server_vad. Standaard 0.5.
  vad_prefix_padding_ms:
    name: "Advanced · server_vad voorloop (ms)"
    description: Alleen bij server_vad. Standaard 300.
  vad_silence_duration_ms:
    name: "Advanced · server_vad stilte tot einde beurt (ms)"
    description: Alleen bij server_vad. Standaard 800.
  enable_recording:
    name: "Advanced · Audio opnemen"
    description: Bewaart mic/speaker-audio in de add-on. Normaal uit laten.
  enable_echo_probe:
    name: "Advanced · Echo-probe"
    description: >-
      Alleen GPT-Live. Neemt de mic op tijdens afspelen voor echometingen.
      Schakelt barge-in niet in. Normaal uit laten.
