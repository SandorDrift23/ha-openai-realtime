# User-facing names + help for the Configuration tab.
# Everyday fields are always visible. Everything under Advanced is optional
# (no default in config.yaml) and only appears when "Show unused optional
# configuration options" is enabled.
configuration:
  openai_api_key:
    name: "OpenAI API key"
    description: >-
      Your personal OpenAI key (starts with sk-...). Create one at
      platform.openai.com → API keys, and make sure billing is set up.
  instructions:
    name: "Assistant personality"
    description: >-
      Plain-text instructions that shape the assistant: personality, language,
      and house rules. EDITING TIP: this field is a single line here — use the
      ⋮ menu → "Edit in YAML" for a full text editor.
  transcription_language:
    name: "Spoken language (e.g. nl, en, de)"
    description: >-
      Two-letter code of the language you speak. Also writes what you said into
      the add-on log. Leave empty for auto-detect.
  openai_voice:
    name: "Voice"
    description: >-
      The voice it speaks with. marin and cedar are the newest. Restart the
      add-on after changing this. For an unlisted voice pick "custom", then
      enable "Show unused optional configuration options" and set Voice (custom).
  follow_up_listen_seconds:
    name: "Follow-up listening (seconds)"
    description: >-
      After an answer the device keeps listening this long without a wake word.
      8 feels natural; 0 turns it off.
  enable_web_search:
    name: "Enable web search"
    description: >-
      Lets the assistant look things up online: weather, news, opening hours,
      recent events. Each lookup is one extra OpenAI call on your key.

  voice_provider:
    name: "Advanced · Voice provider"
    description: >-
      Leave unset for gpt_live (gpt-live-1). openai_realtime is the previous
      engine and needs the Realtime model below.
  openai_model:
    name: "Advanced · Legacy Realtime model"
    description: >-
      Only for voice_provider=openai_realtime. Ignored by gpt-live-1.
  openai_model_custom:
    name: "Advanced · Legacy Realtime model (custom)"
    description: Only used when Legacy Realtime model is "custom".
  openai_voice_custom:
    name: "Advanced · Voice (custom)"
    description: Only used when Voice is set to "custom".
  openai_speed:
    name: "Advanced · Speaking speed"
    description: "1.0 = normal. Range 0.25–1.5. Default 1.0 when unset."
  max_output_tokens:
    name: "Advanced · Maximum answer length"
    description: Caps answer length in tokens. 0 or unset = no cap.
  follow_up_open_delay_ms:
    name: "Advanced · Follow-up mic delay (ms)"
    description: Pause after an answer before the mic re-opens. Default 700.
  wake_open_delay_ms:
    name: "Advanced · Wake mic delay (ms)"
    description: Pause after the wake chime before the mic opens. Default 700.
  vad_eagerness:
    name: "Advanced · Turn-taking speed"
    description: Legacy Realtime VAD eagerness. Default low when unset.
  phase_idle_debounce_ms:
    name: "Advanced · End-of-answer hold (ms)"
    description: How long silence ends a reply. Default 1500.
  web_search_model:
    name: "Advanced · Search model"
    description: Model for web search. Default gpt-5.5 when unset.
  web_search_model_custom:
    name: "Advanced · Search model (custom)"
    description: Only used when Search model is "custom".
  playback_prebuffer_ms:
    name: "Advanced · Playback buffer (ms)"
    description: Device jitter buffer before playback starts. Default 150.
  noise_reduction:
    name: "Advanced · Microphone noise reduction"
    description: Extra mic filtering. Default off when unset.
  ha_mcp_url:
    name: "Advanced · MCP server URL"
    description: Leave unset to use Home Assistant's built-in MCP Server.
  longlived_token:
    name: "Advanced · Access token"
    description: Leave unset to use the add-on's built-in supervisor token.
  mcp_tool_allowlist:
    name: "Advanced · Tool allow-list"
    description: "Comma-separated Assist tools; empty/unset = all of them."
  live_planner_model:
    name: "Advanced · GPT-Live planner model"
    description: Text model that chooses Assist tools / web_search. Default gpt-5.5.
  live_planner_model_custom:
    name: "Advanced · GPT-Live planner model (custom)"
    description: Only used when the planner model is "custom".
  websocket_port:
    name: "Advanced · Device port"
    description: Port the Voice PE connects to. Default 8080.
  session_reuse_timeout_seconds:
    name: "Advanced · Conversation resume window (seconds)"
    description: Legacy Realtime session reuse. Default 300.
  max_context_messages:
    name: "Advanced · Conversation memory size"
    description: Legacy Realtime memory size. Default 12.
  transcription_model:
    name: "Advanced · Transcript model"
    description: Writes your speech into the log when a language is set. Default gpt-4o-transcribe.
  transcription_model_custom:
    name: "Advanced · Transcript model (custom)"
    description: Only used when Transcript model is "custom".
  turn_detection_type:
    name: "Advanced · Turn detection (legacy)"
    description: Leave unset. Only needed for the old openai_realtime path.
  vad_threshold:
    name: "Advanced · server_vad loudness threshold"
    description: Only with server_vad. Default 0.5.
  vad_prefix_padding_ms:
    name: "Advanced · server_vad lead-in (ms)"
    description: Only with server_vad. Default 300.
  vad_silence_duration_ms:
    name: "Advanced · server_vad silence to end turn (ms)"
    description: Only with server_vad. Default 800.
  enable_recording:
    name: "Advanced · Record audio"
    description: Saves mic/speaker audio inside the add-on. Leave off normally.
  enable_echo_probe:
    name: "Advanced · Echo probe"
    description: >-
      GPT-Live only. Records the mic during playback for echo measurements.
      Does not enable barge-in. Leave off normally.
